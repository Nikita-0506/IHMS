<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IHMS Module View</title>
<style>
:root {
  --bg: #f3f7fc;
  --surface: #ffffff;
  --surface-soft: #f7fbff;
  --border: #dce7f3;
  --text: #0f223c;
  --muted: #5b7694;
  --brand: #0b75b8;
  --brand-dark: #07598f;
  --ok: #11a36a;
  --warn: #d97706;
  --danger: #d23a3a;
  --radius: 14px;
  --shadow: 0 10px 30px rgba(15, 34, 60, 0.1);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at 15% 10%, rgba(11, 117, 184, 0.12), transparent 36%),
    radial-gradient(circle at 90% 0%, rgba(17, 163, 106, 0.08), transparent 30%),
    var(--bg);
}

.page {
  max-width: 1100px;
  margin: 0 auto;
  padding: 1.2rem 1rem 1.8rem;
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 1rem;
}

.brand {
  display: flex;
  align-items: center;
  gap: 0.7rem;
}

.brand-badge {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  color: #fff;
  font-weight: 700;
  background: linear-gradient(135deg, #0b75b8, #0cc0de);
}

.brand h1 {
  margin: 0;
  font-size: 1.05rem;
}

.brand p {
  margin: 0.2rem 0 0;
  font-size: 0.78rem;
  color: var(--muted);
}

.actions {
  display: flex;
  gap: 0.55rem;
}

.btn {
  border: 1px solid var(--border);
  background: #fff;
  color: var(--text);
  border-radius: 10px;
  padding: 0.55rem 0.8rem;
  font-size: 0.83rem;
  font-weight: 600;
  cursor: pointer;
}

.btn.primary {
  background: var(--brand);
  color: #fff;
  border-color: var(--brand);
}

.hero {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  box-shadow: var(--shadow);
  padding: 1.2rem 1.2rem 1rem;
}

.hero-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 1rem;
}

.hero h2 {
  margin: 0;
  font-size: 1.35rem;
}

.hero p {
  margin: 0.45rem 0 0;
  color: var(--muted);
  line-height: 1.6;
}

.status {
  font-size: 0.72rem;
  padding: 0.24rem 0.65rem;
  border-radius: 999px;
  background: #d9f7ea;
  color: var(--ok);
  font-weight: 700;
}

.stats {
  margin-top: 1rem;
  display: grid;
  grid-template-columns: repeat(4, minmax(130px, 1fr));
  gap: 0.7rem;
}

.stat {
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface-soft);
  padding: 0.7rem;
}

.stat h3 {
  margin: 0;
  font-size: 1.2rem;
}

.stat p {
  margin: 0.2rem 0 0;
  font-size: 0.75rem;
  color: var(--muted);
}

.grid {
  margin-top: 1rem;
  display: grid;
  grid-template-columns: 1.25fr 1fr;
  gap: 1rem;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem;
}

.card h3 {
  margin: 0;
  font-size: 0.98rem;
}

.sub {
  margin: 0.3rem 0 0.8rem;
  font-size: 0.78rem;
  color: var(--muted);
}

.table-wrap {
  overflow-x: auto;
}

.table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.8rem;
}

.table th,
.table td {
  padding: 0.55rem 0.45rem;
  border-bottom: 1px solid var(--border);
  text-align: left;
}

.table th {
  color: var(--muted);
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.tag-list {
  display: flex;
  flex-wrap: wrap;
  gap: 0.45rem;
}

.tag {
  padding: 0.25rem 0.62rem;
  border-radius: 999px;
  font-size: 0.73rem;
  font-weight: 600;
  background: #e8f3ff;
  color: var(--brand-dark);
}

.kpi {
  margin-top: 0.6rem;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.6rem;
}

.kpi .item {
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.6rem;
  background: var(--surface-soft);
}

.kpi .item b {
  font-size: 1rem;
}

.kpi .item div {
  font-size: 0.72rem;
  color: var(--muted);
}

@media (max-width: 900px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .grid { grid-template-columns: 1fr; }
}

@media (max-width: 520px) {
  .stats { grid-template-columns: 1fr; }
  .top { flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <div class="brand">
      <div class="brand-badge">IH</div>
      <div>
        <h1 id="pageTitle">IHMS Module</h1>
        <p>Clean operational view for module details</p>
      </div>
    </div>
    <div class="actions">
      <button class="btn" type="button" onclick="window.location.href='ihms_dashboard_ui.html'">Back To Dashboard</button>
      <button class="btn primary" id="openEndpointBtn" type="button">Open Endpoint</button>
    </div>
  </div>

  <section class="hero">
    <div class="hero-top">
      <div>
        <h2 id="moduleName">Module Name</h2>
        <p id="moduleDesc">Module details and operations.</p>
      </div>
      <span class="status" id="moduleStatus">LIVE</span>
    </div>

    <div class="stats" id="statsGrid"></div>
  </section>

  <div class="grid">
    <section class="card">
      <h3>Recent Records</h3>
      <p class="sub">Relevant sample records for this module</p>
      <div class="table-wrap">
        <table class="table" id="recordsTable"></table>
      </div>
    </section>

    <section class="card">
      <h3>Quick Overview</h3>
      <p class="sub">Operational summary and integrations</p>
      <div class="tag-list" id="tagList"></div>
      <div class="kpi" id="kpiGrid"></div>
    </section>
  </div>
</div>

};

function getModuleFromURL() {
  const params = new URLSearchParams(window.location.search);
  return params.get('module') || 'patients';
}

function renderModule(moduleKey) {
  const data = moduleData[moduleKey] || moduleData.patients;

  document.getElementById('pageTitle').textContent = `IHMS | ${data.title}`;
  document.title = `IHMS | ${data.title}`;
  document.getElementById('moduleName').textContent = data.title;
  document.getElementById('moduleDesc').textContent = data.desc;

  document.getElementById('openEndpointBtn').onclick = () => {
    window.open(data.endpoint, '_blank');
  };

  const statsGrid = document.getElementById('statsGrid');
  statsGrid.innerHTML = data.stats
    .map(([value, label]) => `<div class="stat"><h3>${value}</h3><p>${label}</p></div>`)
    .join('');

  const tagList = document.getElementById('tagList');
  tagList.innerHTML = data.tags.map((t) => `<span class="tag">${t}</span>`).join('');

  const kpiGrid = document.getElementById('kpiGrid');
  kpiGrid.innerHTML = data.kpis
    .map(([value, label]) => `<div class="item"><b>${value}</b><div>${label}</div></div>`)
    .join('');

  const table = document.getElementById('recordsTable');
  const head = `<thead><tr>${data.columns.map((c) => `<th>${c}</th>`).join('')}</tr></thead>`;
  const body = `<tbody>${data.rows.map((row) => `<tr>${row.map((cell) => `<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody>`;
  table.innerHTML = head + body;
}

renderModule(getModuleFromURL());
</script>
</body>
</html>
