services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ihms-web
    command: sh scripts/start-web.sh
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      HOME: /tmp
      CELERY_BROKER_URL: redis://redis:6379/0
      CACHES_DEFAULT_LOCATION: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - static_data:/app/staticfiles
      - media_data:/app/media
      - history_data:/app/history
      - logs_data:/app/logs
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8000/api/v1/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  db:
    image: postgres:16-alpine
    container_name: ihms-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ihms-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ihms-celery-worker
    command: sh scripts/start-celery-worker.sh
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      HOME: /tmp
      CELERY_BROKER_URL: redis://redis:6379/0
      CACHES_DEFAULT_LOCATION: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - media_data:/app/media
      - history_data:/app/history
      - logs_data:/app/logs
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ihms-celery-beat
    command: sh scripts/start-celery-beat.sh
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      HOME: /tmp
      CELERY_BROKER_URL: redis://redis:6379/0
      CACHES_DEFAULT_LOCATION: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - history_data:/app/history
      - logs_data:/app/logs
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: ihms-nginx
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:
  history_data:
  logs_data: