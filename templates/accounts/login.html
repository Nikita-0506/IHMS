<!DOCTYPE html>
<html>

<head>
    <title>JWT Login</title>

    <style>

        body{
            font-family: Arial;
            padding: 40px;
        }

        .container{
            width: 400px;
            margin: auto;
        }

        input{
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }

        .password-wrap{
            position: relative;
            margin-top: 10px;
        }

        .password-wrap input{
            margin-top: 0;
            padding-right: 42px;
        }

        .password-toggle{
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            margin-top: 0;
            padding: 4px;
            border: none;
            background: transparent;
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
        }

        button{
            margin-top: 10px;
            padding: 10px 20px;
            cursor: pointer;
        }

        #tokenBox{
            margin-top: 20px;
            display: none;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Login</h2>

    <input type="text" id="username" placeholder="Username">

    <div class="password-wrap">
        <input type="password" id="password" placeholder="Password">
        <button type="button" class="password-toggle" onclick="toggleLoginPassword()" aria-label="Show password" id="loginPasswordToggle">👁️</button>
    </div>

    <button onclick="loginUser()">Login</button>

   <div id="tokenBox">

    <h3>Access Token</h3>

    <div class="token-container">

        <input type="password" id="tokenField" readonly>

        <button class="icon-btn" onclick="toggleToken()">

            <span id="eyeIcon">👁️</span>

        </button>

    </div>

</div>

</div>

<script>

async function loginUser(){

    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    const response = await fetch('/api/accounts/login/', {

        method: 'POST',

        headers: {
            'Content-Type': 'application/json'
        },

        body: JSON.stringify({
            username: username,
            password: password
        })
    });

    const data = await response.json();

    if(data.access){

        document.getElementById('tokenBox').style.display = 'block';

        document.getElementById('tokenField').value = data.access;

    } else {

        alert("Invalid Credentials");

    }
}

function toggleToken(){

    const field = document.getElementById('tokenField');
    const eyeIcon = document.getElementById('eyeIcon');

    if(field.type === "password"){

        field.type = "text";
        eyeIcon.innerHTML = "🙈";

    } else {

        field.type = "password";
        eyeIcon.innerHTML = "👁️";
    }
}

function toggleLoginPassword(){

    const field = document.getElementById('password');
    const toggleBtn = document.getElementById('loginPasswordToggle');

    if(field.type === "password"){

        field.type = "text";
        toggleBtn.textContent = "🙈";
        toggleBtn.setAttribute('aria-label', 'Hide password');

    } else {

        field.type = "password";
        toggleBtn.textContent = "👁️";
        toggleBtn.setAttribute('aria-label', 'Show password');
    }
}

</script>

</body>
</html>
